name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build artifacts
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p dist
          build_date=$(date -u +%FT%TZ)
          ldflags="-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${build_date}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            name="actions-updater_${os}_${arch}"
            ext=""
            if [ "${os}" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags "${ldflags}" -o "dist/${name}${ext}" ./cmd/actions-updater
            if [ "${os}" = windows ]; then
              (cd dist && zip "${name}.zip" "${name}${ext}")
              rm "dist/${name}${ext}"
            else
              (cd dist && tar -czf "${name}.tar.gz" "${name}")
              rm "dist/${name}"
            fi
          done
          sha256sum dist/* > dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
